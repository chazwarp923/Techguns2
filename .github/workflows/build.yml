name: Build and game tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          # only builds of the default branch and the port branch write the cache; other branches read it
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/port/neoforge-1.21.1' }}
          # cache downloaded dependencies only, never compiled outputs of the mod
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Build
        run: ./gradlew build --console=plain

      # Headless game server running every @GameTest (worldgen, gameplay, data, manual, ores, models).
      # A failed required test exits non-zero. A crash while loading mods exits 0, so each run also has to log
      # "All N required tests passed". Every run's log is kept for the upload below.
      - name: Game tests
        run: |
          mkdir -p gametest-logs
          ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest-logs/plain.log
          grep -qE "All [0-9]+ required tests passed" gametest-logs/plain.log

      # Again with the mods the compat recipes are for, all three and Create alone (its crushed-ore recipes only
      # load without Mekanism and IE). The compatRecipes test checks that every recipe that should load parses.
      - name: Game tests with Create, Mekanism and Immersive Engineering
        run: |
          ./gradlew runGameTestServer -Pcompat_mods=true --console=plain 2>&1 | tee gametest-logs/compat_all.log
          grep -qE "All [0-9]+ required tests passed" gametest-logs/compat_all.log

      - name: Game tests with Create only
        run: |
          ./gradlew runGameTestServer -Pcompat_mods=create --console=plain 2>&1 | tee gametest-logs/compat_create.log
          grep -qE "All [0-9]+ required tests passed" gametest-logs/compat_create.log

      # No build outputs (jars) are uploaded: the license doesn't allow distributing builds.
      - name: Upload game test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-logs
          path: |
            gametest-logs/
            run-gametest/logs/
          if-no-files-found: ignore
