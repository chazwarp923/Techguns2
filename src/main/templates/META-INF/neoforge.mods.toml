modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/pWn3d1337/Techguns2/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/pWn3d1337/Techguns2"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="required"
    versionRange="[9.5.1,)"
    ordering="NONE"
    side="BOTH"

# optional: machine security levels "allies" and "team"
[[dependencies.${mod_id}]]
    modId="ftbteams"
    type="optional"
    versionRange="[2101.1.0,)"
    ordering="NONE"
    side="BOTH"

# optional: the Techguns Manual guide book
[[dependencies.${mod_id}]]
    modId="patchouli"
    type="optional"
    versionRange="[1.21.1-90,)"
    ordering="NONE"
    side="BOTH"

# optional: Jade overlay (machine progress, owner, security)
[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="[15.0,)"
    ordering="NONE"
    side="BOTH"

# optional: Ponder scenes for the multiblock machines
[[dependencies.${mod_id}]]
    modId="ponder"
    type="optional"
    versionRange="[1.0.60,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
