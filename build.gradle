plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Add mod dependency repositories here (e.g. JEI, CraftTweaker) once the port reaches that point.
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
        content { includeGroup "top.theillusivec4.curios" }
    }
    maven {
        name = "Jared's maven (JEI)"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
            includeGroup "net.mezzdev.config"
            includeGroup "vazkii.patchouli"
        }
    }
    maven {
        name = "FTB"
        url = "https://maven.ftb.dev/releases"
        content { includeGroup "dev.ftb.mods" }
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
        content { includeGroup "dev.architectury" }
    }
    maven {
        name = "Create (Ponder, Flywheel)"
        url = "https://maven.createmod.net"
        content {
            includeGroup "net.createmod.ponder"
            includeGroup "dev.engine-room.flywheel"
        }
    }
    maven {
        name = "ModMaven (Mekanism API)"
        url = "https://modmaven.dev/"
        content { includeGroup "mekanism" }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Uncomment once src/main/resources/META-INF/accesstransformer.cfg exists (the 1.12.2 techguns_at.cfg uses old SRG names).
    // accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // automated in-game checks (techguns.client.test.ClientTestHarness): makes a test world, takes screenshots,
        // writes run-clienttest/clienttest/report.txt and quits
        clientTest {
            client()
            gameDirectory = project.file('run-clienttest')
            systemProperty 'techguns.clientTest', 'true'
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Mod dependencies go here, e.g.:
    // compileOnly "mezz.jei:jei-1.21.1-neoforge-api:<version>"
    // localRuntime "mezz.jei:jei-1.21.1-neoforge:<version>"

    // face / back / hands, ammo, food and healing slots (replaces the 1.12 Techguns player inventory)
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    // JEI only in the dev client, not a dependency of the mod
    // JEI: recipe categories for the machines (techguns.plugins.jei), the full mod only in the dev client
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // JEI needs the mezz_config mod at runtime, its pom only pulls in the API
    localRuntime "net.mezzdev.config:mezz_config-${minecraft_version}-neoforge:${mezz_config_version}"
    // FTB Teams: optional, gives the machine security its ally / team levels
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    localRuntime "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    localRuntime "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    localRuntime "dev.architectury:architectury-neoforge:${architectury_version}"
    // Patchouli: optional, loads the Techguns Manual (the book is pure data, no code depends on it)
    localRuntime "vazkii.patchouli:Patchouli:${patchouli_version}"
    // Ponder: optional, multiblock scenes (techguns.plugins.ponder). The NeoForge jar already contains the common
    // classes, so its pom's Ponder-Common is left out; Flywheel is only needed by the client at runtime
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    localRuntime("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    localRuntime "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    // Jade: optional, machine progress / owner / security in the look-at overlay (techguns.plugins.jade)
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"
    // Powah (FE generators to power the machines) and its dependencies, dev client only
    localRuntime "maven.modrinth:powah:${powah_version}"
    localRuntime "maven.modrinth:cloth-config:${cloth_config_version}"
    localRuntime "maven.modrinth:guideme:${guideme_version}"
    // C2ME (multithreaded chunk generation), dev client only: tests worldgen code under concurrency; bundles its own libraries
    localRuntime "maven.modrinth:c2me-neoforge:${c2me_version}"
    // Mekanism API: optional radiation bridge (techguns.plugins.mekanism), only loaded when Mekanism is installed
    compileOnly "mekanism:Mekanism:${minecraft_version}-${mekanism_version}:api"
    // Create, Mekanism and Immersive Engineering: the compat recipes in data/techguns/recipe/compat are pure data, loaded
    // only when that mod is installed. All three are in the dev runs by default (compat_mods=true in gradle.properties);
    // -Pcompat_mods=false leaves them out, or name some, e.g. -Pcompat_mods=create (the game tests then check that
    // every compat recipe that should load parses)
    def compatMods = (project.findProperty("compat_mods") ?: "").toString()
    def compatAll = compatMods == "true"
    def compatList = compatMods.split(",")*.trim()
    if (compatAll || "create" in compatList) localRuntime "maven.modrinth:create:${create_version}"
    if (compatAll || "mekanism" in compatList) localRuntime "maven.modrinth:mekanism:${mekanism_version}"
    if (compatAll || "immersiveengineering" in compatList) localRuntime "maven.modrinth:immersiveengineering:${immersive_engineering_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
